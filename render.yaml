services:
  - type: web
    name: erlc-navigator
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: node server.js
    healthCheckPath: /healthz
    envVars:
      - key: ERLC_SERVER_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: SERVER_SECRET
        sync: false
      - key: INVITE_CODE
        sync: false
      - key: DISCORD_CLIENT_ID
        sync: false
      - key: DISCORD_CLIENT_SECRET
        sync: false
      - key: SESSION_SECRET
        sync: false
      - key: OWNER_DISCORD_IDS
        sync: false
