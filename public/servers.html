<style>
:root{--bg:#f5f5f7;--card:#fff;--text:#1d1d1f;--muted:#6e6e73;--line:rgba(0,0,0,.1);--accent:#0071e3}
@media(prefers-color-scheme:dark){:root{--bg:#000;--card:#161618;--text:#f5f5f7;--muted:#a1a1a6;--line:rgba(255,255,255,.14);--accent:#2997ff}}
*{box-sizing:border-box}body{margin:0;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",system-ui,sans-serif;background:var(--bg);color:var(--text);padding:24px}
main{max-width:620px;margin:0 auto}a{color:var(--accent);text-decoration:none}h1{font-size:34px;letter-spacing:-.03em;margin:10px 0 6px}p{color:var(--muted);line-height:1.5}
.card{background:var(--card);border-radius:20px;padding:8px 20px;box-shadow:inset 0 0 0 1px var(--line);margin:18px 0}
.card a.row{display:flex;justify-content:space-between;gap:12px;padding:15px 0;border-bottom:1px solid var(--line);color:var(--text);font-weight:600}.card a.row:last-child{border:0}.card a.row span{color:var(--muted);font-weight:400}
.btn{display:inline-block;background:var(--accent);color:#fff;padding:12px 22px;border-radius:980px;font-weight:600}
</style></head><body><main>
<p><a href="/">&larr; ERLC Navigator</a></p>
<h1>Servers</h1><p>ER:LC communities using ERLC Navigator. Each has its own places, closed roads and buildings.</p>
<div class="card" id="dir"><p style="padding:12px 0">Loading…</p></div>
<p><a class="btn" href="/dashboard">Set up your own server</a></p>
<script>
fetch("/api/servers").then(r=>r.json()).then(l=>{const d=document.getElementById("dir");d.textContent="";l.forEach(s=>{const a=document.createElement("a");a.className="row";const u=s.slug==="main"?"/app":"/s/"+s.slug;a.href=u;const n=document.createElement("b");n.textContent=s.name;const p=document.createElement("span");p.textContent=u;a.append(n,p);d.appendChild(a)})}).catch(()=>{document.getElementById("dir").textContent="Couldn’t load the list."});
</script></main></body></html>
